name: hindsight-custom-models-timescale

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: always
    ports:
      - "${HINDSIGHT_DB_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-hindsight_password}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hindsight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user} -d ${HINDSIGHT_DB_NAME:-hindsight_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescale-init:
    build:
      context: .
      dockerfile: Dockerfile.db
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${HINDSIGHT_DB_PASSWORD:-hindsight_password}
      HINDSIGHT_DB_HOST: db
      HINDSIGHT_DB_PORT: 5432
      HINDSIGHT_DB_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      HINDSIGHT_DB_NAME: ${HINDSIGHT_DB_NAME:-hindsight_db}
    command: ["/usr/local/bin/init-timescale.sh"]
    restart: "no"
    networks:
      - hindsight-net

  hindsight:
    build:
      context: .
      dockerfile: Dockerfile.hindsight
      args:
        EMBEDDER: ${HINDSIGHT_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
        RERANKER: ${HINDSIGHT_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
    ports:
      - "${HINDSIGHT_HTTP_PORT:-8888}:8888"
      - "${HINDSIGHT_GRPC_PORT:-9999}:9999"
    deploy:
      resources:
        limits:
          cpus: "${HINDSIGHT_CPU_LIMIT:-4.0}"
    environment:
      # ── CPU thread limit buat embedder & reranker ──
      OMP_NUM_THREADS: ${HINDSIGHT_OMP_NUM_THREADS:-3}
      MKL_NUM_THREADS: ${HINDSIGHT_OMP_NUM_THREADS:-3}
      NUMEXPR_NUM_THREADS: ${HINDSIGHT_OMP_NUM_THREADS:-3}
      TOKENIZERS_PARALLELISM: ${HINDSIGHT_TOKENIZERS_PARALLELISM:-true}

      # ── LLM (custom OpenAI-compatible, e.g. DeepSeek) ──
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-deepseek-v4-flash}

      # ── REST API authentication for coding-agent hooks ──
      HINDSIGHT_API_TENANT_EXTENSION: ${HINDSIGHT_API_TENANT_EXTENSION:-}
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:-}

      # ── Optional direct remote MCP authentication ──
      HINDSIGHT_API_MCP_ENABLED: ${HINDSIGHT_API_MCP_ENABLED:-true}
      HINDSIGHT_API_MCP_AUTH_TOKEN: ${HINDSIGHT_API_MCP_AUTH_TOKEN:-}
      HINDSIGHT_API_MCP_ENABLED_TOOLS: ${HINDSIGHT_API_MCP_ENABLED_TOOLS:-recall,retain,reflect}

      # ── Local embeddings & reranker ──
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: ${HINDSIGHT_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: ${HINDSIGHT_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}

      # ── Database (Timescale) ──
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_DATABASE_URL:-postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD:-hindsight_password}@db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}}

      # ── Timescale extensions ──
      HINDSIGHT_API_VECTOR_EXTENSION: pgvectorscale
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pg_textsearch

      # ── Offline mode: fail fast if model is missing ──
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      db:
        condition: service_healthy
      timescale-init:
        condition: service_completed_successfully
    networks:
      - hindsight-net

networks:
  hindsight-net:
    driver: bridge

volumes:
  pg_data:
